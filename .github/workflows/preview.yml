# For every pull request: give it its own Neon database branch (a copy of production),
# apply migrations there, deploy a Vercel preview that uses it, and comment the link.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Vercel team and project (not secret); override with secrets of the same name if they change.
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_Unz0xhMomxOrSsadcihub6QL' }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_6mSZ5qHojg3XrI2zo71V92xVmVGm' }}
  VERCEL_CLI_VERSION: 64.2.0
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
  # Neon project and database; override with repository variables if they change.
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || 'tiny-mountain-02320573' }}
  NEON_DATABASE: ${{ vars.NEON_DATABASE || 'document editor' }}
  NEON_ROLE: ${{ vars.NEON_ROLE || 'neondb_owner' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Neon branch + Vercel preview
    needs: ci
    # Secrets are not available to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node .github/scripts/check-config.mjs VERCEL_TOKEN NEON_API_KEY

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ env.NEON_BRANCH }}
          database: ${{ env.NEON_DATABASE }}
          role: ${{ env.NEON_ROLE }}

      - name: Build connection strings
        id: db
        env:
          HOST: ${{ steps.neon.outputs.db_host }}
          HOST_POOLED: ${{ steps.neon.outputs.db_host_pooled }}
          PASSWORD: ${{ steps.neon.outputs.password }}
          ROLE: ${{ env.NEON_ROLE }}
          DATABASE: ${{ env.NEON_DATABASE }}
        run: node .github/scripts/neon-urls.mjs

      - name: Apply migrations to the branch
        run: npm run db:deploy -w backend
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.db.outputs.direct }}

      - run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # Express parses requests itself; turn off Vercel's request helpers.
          NODEJS_HELPERS: "0"

      # The branch's database URLs are set on this deployment only. Google sign-in can't work on
      # preview URLs (Google needs exact origins), so previews also allow test password sign-in.
      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DB_POOLED: ${{ steps.db.outputs.pooled }}
          DB_DIRECT: ${{ steps.db.outputs.direct }}
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" \
            --env DATABASE_URL="$DB_POOLED" --env DATABASE_URL_UNPOOLED="$DB_DIRECT" \
            --env PASSWORD_AUTH_ENABLED=true | node .github/scripts/deploy-url.mjs)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview link
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- preview-deployment -->'
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Database: Neon branch \`${process.env.NEON_BRANCH}\` (a copy of production, deleted when this pull request closes).`,
              `Commit: ${context.payload.pull_request.head.sha.slice(0, 7)}`,
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
