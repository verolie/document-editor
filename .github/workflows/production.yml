# On every push to main: check the build, migrate the production Neon database,
# then build and deploy to Vercel production.
name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys (and migrations) at the same time.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Vercel team and project (not secret); override with secrets of the same name if they change.
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_Unz0xhMomxOrSsadcihub6QL' }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_6mSZ5qHojg3XrI2zo71V92xVmVGm' }}
  VERCEL_CLI_VERSION: 64.2.0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate database + deploy to Vercel
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: node .github/scripts/check-config.mjs VERCEL_TOKEN DATABASE_URL_UNPOOLED

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs before the new code goes live; keep migrations backward compatible
      # (add columns first, remove old ones in a later release).
      - name: Apply database migrations
        run: npm run db:deploy -w backend
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # Express parses requests itself; turn off Vercel's request helpers.
          NODEJS_HELPERS: "0"

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
